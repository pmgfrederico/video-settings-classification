<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Settings — In Game</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #05070B; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  .devbar { background: #0F172A; color: #CBD5E1; font-family: var(--mono); font-size: 11px; display: flex; align-items: center; gap: 14px; padding: 6px 16px; flex-shrink: 0; z-index: 30; }
  .devbar b { color: #fff; letter-spacing: .08em; }
  .devbar select { font: inherit; background: #1E293B; color: #fff; border: 1px solid #334155; border-radius: 4px; padding: 3px 6px; }
  .devbar .seg { background: #1E293B; border-color: #334155; padding: 2px; }
  .devbar .seg button { color: #94A3B8; padding: 2px 8px; font-size: 11px; }
  .devbar .seg button.on { background: #FA5A46; color: #fff; }
  .devbar a { color: #93C5FD; margin-left: auto; }
  .devbar .keys { color: #64748B; }
  .stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; perspective: 1400px; }
  .panels { display: flex; align-items: center; height: 100%; width: 100%; justify-content: center; transform-style: preserve-3d; }
  .panel { position: relative; height: 100%; overflow: hidden; flex-shrink: 0; transition: transform .15s; }
  .panel svg { width: 100%; height: 100%; display: block; }
  .veil { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
  .compare-tag { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #fff; background: rgba(250,90,70,.9); padding: 5px 12px; border-radius: 4px; display: none; z-index: 12; }
  .compare .compare-tag { display: block; }

  /* --- perf strip (minimal, top-right) --- */
  .perf { position: absolute; top: 12px; right: 14px; z-index: 10; display: flex; gap: 2px; font-family: var(--mono); font-size: 11px; color: #E2E8F0; background: rgba(2,6,23,.55); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.08); border-radius: 6px; padding: 5px 4px; }
  .perf div { padding: 0 8px; border-left: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: flex-start; }
  .perf div:first-child { border-left: 0; }
  .perf span { font-size: 8.5px; color: #94A3B8; text-transform: uppercase; letter-spacing: .06em; }
  .perf b { font-weight: 600; font-size: 12px; }
  .perf .hot { color: #FCA5A5; }

  /* --- live HUD tuner (B3b): edge-docked, one control in focus --- */
  .hud { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 11; color: #F1F5F9; font-size: 12px; }
  .hud-pill { display: flex; gap: 8px; align-items: center; background: rgba(2,6,23,.55); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.1); border-radius: 99px; padding: 6px 14px; font-family: var(--mono); font-size: 11px; color: #CBD5E1; cursor: pointer; }
  .hud-pill:hover { color: #fff; border-color: rgba(250,90,70,.6); }
  .tuner { width: min(760px, 92vw); background: rgba(2,6,23,.62); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 10px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .tuner-top { display: flex; align-items: center; gap: 10px; }
  .tuner-top .nav { border: 1px solid rgba(255,255,255,.15); background: transparent; color: #E2E8F0; border-radius: 5px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .tuner-top .nav:hover { border-color: var(--red); }
  /* Every row has a fixed height and never wraps, so the tuner keeps its size as you move between settings. */
  .tuner-name { width: 230px; flex-shrink: 0; min-width: 0; }
  .tuner-label { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tuner-idx { font-family: var(--mono); font-size: 10.5px; color: #94A3B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tuner-dots { display: flex; gap: 3px; margin-left: 4px; }
  .tuner-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.2); }
  .tuner-dots i.on { background: var(--red); }
  .tuner-dots i.mod { background: #C4B5FD; }
  .tuner-dots i.on.mod { background: var(--red); box-shadow: 0 0 0 2px #C4B5FD; }
  .tuner-ctl { display: flex; align-items: center; gap: 12px; height: 30px; }
  .tuner-ctl input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 3px; background: rgba(255,255,255,.25); border-radius: 99px; outline: none; }
  .tuner-ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #fff; border: 2.5px solid var(--red); cursor: pointer; }
  .tuner-ctl output { font-family: var(--mono); font-weight: 600; min-width: 90px; text-align: right; }
  /* Long option lists scroll sideways instead of wrapping onto a second line. */
  .tseg { display: flex; gap: 3px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .tseg::-webkit-scrollbar { display: none; }
  .tseg button { flex-shrink: 0; white-space: nowrap; border: 1px solid rgba(255,255,255,.15); background: transparent; color: #CBD5E1; font-size: 11.5px; padding: 4px 10px; border-radius: 5px; }
  .tseg button.on { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .tuner-foot { display: flex; align-items: center; gap: 10px; height: 24px; font-family: var(--mono); font-size: 10.5px; color: #94A3B8; white-space: nowrap; }
  .tuner-foot .ro { color: #CBD5E1; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tuner-foot .sp { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .tbtn { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); color: #E2E8F0; font-size: 11px; padding: 4px 10px; border-radius: 5px; font-family: var(--font); font-weight: 600; }
  .tbtn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .tbtn:hover { filter: brightness(1.15); }
  kbd { font-family: var(--mono); font-size: 10px; border: 1px solid rgba(255,255,255,.25); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: #E2E8F0; }

  /* --- pause menu (B3a) --- */
  .pause { position: absolute; inset: 0; z-index: 20; background: rgba(2,6,23,.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; }
  .pmenu { width: min(1180px, 96vw); height: min(760px, 90%); background: var(--bg); border-radius: 12px; display: grid; grid-template-columns: 200px 1fr 300px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .ptabs { background: #fff; border-right: 1px solid var(--border); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .ptabs h2 { font-family: var(--racing); text-transform: uppercase; font-size: 18px; margin: 2px 8px 12px; letter-spacing: .04em; }
  .ptab { text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text-2); display: flex; gap: 8px; align-items: center; }
  .ptab:hover { background: #F1F5F9; }
  .ptab.on { background: var(--red); color: #fff; font-weight: 600; }
  .ptab .ms { font-size: 17px; }
  .ptabs .resume { margin-top: auto; }
  .pbody { overflow-y: auto; padding: 20px 24px; }
  .pbody h3 { font-family: var(--racing); text-transform: uppercase; font-size: 20px; margin: 0 0 4px; letter-spacing: .03em; }
  .pctx { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  details.locked { margin-top: 16px; border: 1px dashed var(--border-2); border-radius: 8px; padding: 10px 12px; background: rgba(255,255,255,.6); }
  details.locked summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-2); }
  details.locked .row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-top: 1px solid var(--border); }
  details.locked .row:first-of-type { border-top: 0; margin-top: 8px; }
  details.locked .row span:last-child { font-family: var(--mono); color: var(--muted); }
  .pside { background: #fff; border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .pside .h { padding: 12px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; background: var(--panel-2); }
  .pside .b { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .pside .f { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<div class="devbar">
  <b>MOCKUP</b>
  <label>Rig <select id="rig"></select></label>
  <span>Session</span><div class="seg" id="mode"></div>
  <span>Online</span><div class="seg" id="online"></div>
  <span class="keys"><kbd>F2</kbd> tuner · <kbd>←</kbd><kbd>→</kbd> setting · <kbd>↑</kbd><kbd>↓</kbd> adjust · hold <kbd>C</kbd> compare · <kbd>Esc</kbd> pause</span>
  <a href="main-menu.html" id="toMenu">← Main menu mockup</a>
</div>
<div class="stage" id="stage">
  <div class="panels" id="panels"></div>
  <div class="compare-tag">BEFORE · release C</div>
  <div class="perf" id="perf"></div>
  <div class="hud" id="hud"></div>
  <div id="pause"></div>
</div>

<!-- World definition: one wide 4800×900 scene; panels show slices of it -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E93CF"/><stop offset=".55" stop-color="#A9CBEA"/><stop offset="1" stop-color="#E6EFF7"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EA35A"/><stop offset="1" stop-color="#4F7A36"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B7280"/><stop offset="1" stop-color="#2F343B"/></linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2329"/><stop offset="1" stop-color="#0B0D10"/></linearGradient>
    <radialGradient id="sunglow"><stop offset="0" stop-color="#FFF8DC" stop-opacity="1"/><stop offset=".25" stop-color="#FFF2C2" stop-opacity=".85"/><stop offset="1" stop-color="#FFF2C2" stop-opacity="0"/></radialGradient>
    <filter id="f-far" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="f-far-b" stdDeviation="0"/></filter>
    <filter id="f-mb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="f-mb-b" stdDeviation="0 0"/></filter>
    <filter id="f-sharp"><feConvolveMatrix id="f-sharp-k" order="3" kernelMatrix="0 0 0 0 1 0 0 0 0" preserveAlpha="true"/></filter>
    <g id="world">
      <g filter="url(#f-sharp)">
        <rect width="4800" height="560" fill="url(#sky)"/>
        <g filter="url(#f-far)">
          <ellipse cx="900" cy="150" rx="260" ry="38" fill="#fff" opacity=".7"/><ellipse cx="1100" cy="130" rx="180" ry="30" fill="#fff" opacity=".6"/>
          <ellipse cx="2100" cy="110" rx="300" ry="34" fill="#fff" opacity=".55"/><ellipse cx="3900" cy="160" rx="240" ry="36" fill="#fff" opacity=".65"/>
          <circle cx="3000" cy="170" r="160" fill="url(#sunglow)"/><circle cx="3000" cy="170" r="42" fill="#FFFBEA"/>
          <polygon points="0,520 300,380 600,450 900,330 1250,460 1600,360 1900,440 2200,300 2550,450 2900,350 3250,430 3600,320 3950,450 4300,370 4800,470 4800,560 0,560" fill="#8DA2BF"/>
          <polygon points="0,540 400,450 750,500 1150,420 1500,505 1850,440 2250,500 2700,430 3100,500 3500,440 3900,510 4300,450 4800,520 4800,560 0,560" fill="#6E86A6"/>
        </g>
        <rect y="540" width="4800" height="360" fill="url(#grass)"/>
        <g filter="url(#f-mb)">
          <g fill="#2F5A2A">
            <path d="M0 560 Q60 470 120 545 Q170 455 240 548 Q300 480 360 552 Q420 470 500 550 Q560 480 640 556 Q700 470 780 552 Q840 490 920 556 Q980 470 1060 552 Q1130 480 1200 556 Q1260 470 1340 552 Q1400 490 1480 558 Q1560 480 1640 556 Q1700 500 1780 558 L1780 572 L0 572 Z"/>
            <path d="M3020 558 Q3100 500 3160 556 Q3220 470 3300 552 Q3360 490 3440 556 Q3500 470 3580 552 Q3650 480 3720 556 Q3780 470 3860 552 Q3920 490 4000 556 Q4060 470 4140 552 Q4210 480 4280 556 Q4340 470 4420 552 Q4480 490 4560 556 Q4620 470 4700 552 Q4760 500 4800 556 L4800 572 L3020 572 Z"/>
          </g>
          <g fill="#3E6B34" opacity=".9">
            <rect x="200" y="640" width="1100" height="16" rx="8"/><rect x="3500" y="660" width="1100" height="18" rx="9"/>
            <rect x="80" y="760" width="1500" height="24" rx="12"/><rect x="3300" y="780" width="1500" height="26" rx="13"/>
          </g>
        </g>
        <polygon points="2330,548 2470,548 3900,900 900,900" fill="url(#road)"/>
        <g fill="#F8FAFC" opacity=".9"><polygon points="2396,560 2404,560 2412,600 2388,600"/><polygon points="2384,640 2416,640 2430,710 2370,710"/><polygon points="2360,790 2440,790 2465,900 2335,900"/></g>
        <g><polygon points="2330,548 2342,548 960,900 900,900" fill="#E11D48"/><polygon points="2458,548 2470,548 3900,900 3840,900" fill="#E11D48"/></g>
        <g transform="translate(2400 610)"><rect x="-58" y="-26" width="116" height="34" rx="8" fill="#1D4ED8"/><rect x="-40" y="-44" width="80" height="22" rx="6" fill="#1E3A8A"/><rect x="-62" y="2" width="22" height="12" rx="3" fill="#111"/><rect x="40" y="2" width="22" height="12" rx="3" fill="#111"/><rect x="-50" y="-16" width="14" height="6" rx="2" fill="#FCA5A5"/><rect x="36" y="-16" width="14" height="6" rx="2" fill="#FCA5A5"/></g>
        <!-- cockpit -->
        <path d="M1560 0 L1700 0 L1900 900 L1680 900 Z" fill="#111418"/>
        <path d="M3240 0 L3100 0 L2900 900 L3120 900 Z" fill="#111418"/>
        <path d="M1500 900 L1640 760 Q2400 700 3160 760 L3300 900 Z" fill="url(#dash)"/>
        <rect x="2310" y="770" width="180" height="70" rx="8" fill="#0B1220" stroke="#334155"/>
        <text x="2400" y="818" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="38" font-weight="700" fill="#34D399">4</text>
        <text x="2340" y="796" font-family="JetBrains Mono, monospace" font-size="14" fill="#94A3B8">212</text>
        <text x="2448" y="796" font-family="JetBrains Mono, monospace" font-size="14" fill="#FCA5A5">7.9k</text>
        <path d="M2190 900 Q2190 760 2400 760 Q2610 760 2610 900" fill="none" stroke="#0A0B0D" stroke-width="34"/>
        <rect x="2120" y="470" width="560" height="48" rx="10" fill="#0E1116"/>
        <rect x="2136" y="478" width="528" height="32" rx="6" fill="#6E86A6" opacity=".55"/>
      </g>

  </defs>
</svg>

<script type="module">
import { evaluate, fromV2, readouts } from './engine.js';
import { loadAll } from './data.js';
import { renderCard, renderLedger, tierBadge, esc, enc, dec, fmt } from './ui.js';

const { bundle, v2, rigs, rigIds } = await loadAll();
const params = new URLSearchParams(location.search);
const S = { rigId: rigIds.includes(params.get('rig')) ? params.get('rig') : rigIds[0], mode: params.get('mode') ?? 'live', online: false, pending: [], hudOpen: params.get('hud') !== '0', hudIndex: 0, compare: false, tab: null };
let facts, base, vm, liveFields = [];
const $ = id => document.getElementById(id);

function loadRig(id) {
  S.rigId = id; facts = rigs[id];
  base = evaluate({ bundle, facts, base: fromV2(v2, facts, bundle) }).cfg;
  S.pending = []; S.hudIndex = 0;
}
const context = () => ({ session: S.mode === 'live' ? 'session.live' : 'session.paused', online: S.online });
function compute() { vm = evaluate({ bundle, facts, base, pending: S.pending, context: context(), disclosure: 'advanced' }); }
function setValue(path, value, rerender = true) {
  S.pending = S.pending.filter(p => p.path !== path);
  if (value !== base[path]) S.pending.push({ path, value });
  if (rerender) render(); else { compute(); renderScene(); renderPerf(); }
}

// ---------- scene: renders the effective config (or the applied one while comparing) ----------
const POST = { Default: '', Natural: 'saturate(.9)', 'Cinematic 1': 'contrast(1.08) saturate(.85) sepia(.08)', 'Cinematic 2': 'contrast(1.12) saturate(.8) hue-rotate(-6deg)', 'Cinematic 3': 'contrast(1.15) saturate(.75) sepia(.15)', Vivid: 'saturate(1.35) contrast(1.05)' };
const LVL = v => ({ Off: 0, Low: 1, Medium: 2, High: 3, Ultra: 4 })[String(v).split('_').pop()] ?? 0;

function renderScene() {
  const cfg = S.compare ? base : vm.cfg;
  const scope = vm.der.scope;
  const ev = cfg['graphics.exposureBias'] ?? 0, fus = cfg['graphics.exposureFusion'] ?? 0;
  let filter = `brightness(${Math.pow(2, ev).toFixed(3)}) contrast(${(1 - 0.18 * fus).toFixed(3)}) ${POST[cfg['graphics.post_processing_preset']] ?? ''}`;
  const aa = cfg['graphics.antialising.filmicAntialiasing.setting'];
  const soft = (aa === 'Type_Soft' ? 0.45 : aa === 'Type_Sharp' ? 0.15 : 0) + (cfg['graphics.antialising.fxaa.enable'] ? 0.35 : 0);
  if (soft) filter += ` blur(${soft}px)`;
  if (scope === 'hmd') filter += ` brightness(${{ Sunglass_Off: 1, Sunglass_Light: 0.8, Sunglass_Dark: 0.6 }[cfg['vr.sunglasses']] ?? 1})`;
  const k = (cfg['graphics.sharpening.strength'] ?? 0) * 0.9;
  document.getElementById('f-sharp-k').setAttribute('kernelMatrix', `0 ${-k} 0 ${-k} ${1 + 4 * k} ${-k} 0 ${-k} 0`);
  document.getElementById('f-far-b').setAttribute('stdDeviation', [0, 0.6, 1.2, 2, 3][LVL(cfg['graphics.depthOfField'])] ?? 0);
  const mbq = LVL(cfg['graphics.motionBlur.quality']);
  const mb = mbq ? (cfg['graphics.motionBlur.strength'] ?? 1) * (1 - 0.5 * (cfg['graphics.motionBlur.centralClarity'] ?? 0)) * 6 : 0;
  document.getElementById('f-mb-b').setAttribute('stdDeviation', `${mb.toFixed(2)} 0`);
  const veil = { Veil_Off: 0, Veil_Soft: 0.35, Veil_Hard: 0.65 }[cfg['graphics.veil']] ?? 0;

  const stage = $('stage').getBoundingClientRect();
  const panels = [];
  if (scope === 'triple') {
    const tw = cfg['display.triple_screen.width'], td = cfg['display.triple_screen.distance'];
    const fov = (2 * Math.atan(tw / 2 / td) * 180) / Math.PI;
    const ang = cfg['display.triple_screen.screen_angle'];
    const bez = cfg['display.triple_screen.bezel'] ?? 20;
    const gap = Math.round(bez * 0.5);
    const w = Math.floor((stage.width - 2 * gap) / 3.15), h = Math.round(w * 9 / 16);
    const sliceW = 1600 * (fov / 44.2);
    for (const i of [-1, 0, 1]) {
      const cx = 2400 + i * sliceW;
      panels.push({ w, h, vb: `${cx - sliceW / 2} ${450 - sliceW * 9 / 32} ${sliceW} ${sliceW * 9 / 16}`, tf: i ? `rotateY(${-i * ang * 0.42}deg)` : '', ml: i === 1 ? gap : 0, mr: i === -1 ? gap : 0 });
    }
  } else {
    const ws = scope === 'hmd' ? cfg['vr.world_scale'] ?? 1 : 1;
    const sliceW = 1600 / ws;
    panels.push({ w: stage.width, h: stage.height, vb: `${2400 - sliceW / 2} ${480 - (sliceW * 9 / 16) / 2 + (scope === 'hmd' ? 0 : 30)} ${sliceW} ${sliceW * 9 / 16}`, tf: '' });
  }
  $('panels').innerHTML = panels.map(p => `<div class="panel" style="width:${p.w}px;height:${p.h}px;transform:${p.tf};margin-left:${p.ml ?? 0}px;margin-right:${p.mr ?? 0}px;filter:${filter}">
      <svg viewBox="${p.vb}" preserveAspectRatio="xMidYMid slice"><use href="#world"/></svg>
      <div class="veil" style="opacity:${veil};background:radial-gradient(circle at ${scope === 'triple' ? 50 : 72}% 18%, rgba(255,246,214,.95), rgba(255,240,200,.25) 28%, transparent 60%)"></div></div>`).join('');
  $('stage').classList.toggle('compare', S.compare);
}

// ---------- perf strip (simulated telemetry around the estimate) ----------
function renderPerf() {
  const e = vm.est, j = n => n * (1 + (Math.random() - 0.5) * 0.04);
  const fps = Math.round(j(e.presentedFps)), low = Math.round(e.presentedFps * 0.82), ft = (1000 / fps).toFixed(1);
  const temp = facts.telemetry.gpuTempC + Math.round(Math.random() * 2);
  $('perf').innerHTML = `<div><span>FPS</span><b>${fps}</b></div><div><span>1% low</span><b>${low}</b></div><div><span>Frame</span><b>${ft} ms</b></div>
    <div><span>GPU</span><b>${Math.min(99, Math.round(j(facts.telemetry.gpuUtil)))}%</b></div><div><span>Temp</span><b class="${temp >= 83 ? 'hot' : ''}">${temp}°C</b></div>
    <div><span>VRAM</span><b class="${e.vramRatio > 0.92 ? 'hot' : ''}">${e.vramGB}/${facts.gpu.vramGB}</b></div><div><span>Latency</span><b>${Math.round(j(e.pcLatencyMs))} ms</b></div>`;
}

// ---------- live HUD tuner (R8: only T3 live-visual / live-geometry, plus explicit opt-ins) ----------
const HUD_ORDER = ['look', 'display', 'image', 'performance', 'world', 'car'];
function computeLiveFields() {
  liveFields = Object.values(vm.fields).filter(f => f.visible && f.state === 'editable' && !f.disclosureHidden)
    .sort((a, b) => HUD_ORDER.indexOf(a.group) - HUD_ORDER.indexOf(b.group));
  S.hudIndex = Math.min(S.hudIndex, Math.max(0, liveFields.length - 1));
}
function renderHud() {
  if (S.mode !== 'live') { $('hud').innerHTML = ''; return; }
  if (!S.hudOpen) { $('hud').innerHTML = `<div class="hud-pill" data-hud="open"><span class="ms">tune</span>Tune view · <kbd>F2</kbd>${vm.ledger.changeCount ? ` · <span style="color:#C4B5FD">${vm.ledger.changeCount} unsaved</span>` : ''}</div>`; return; }
  const f = liveFields[S.hudIndex];
  if (!f) { $('hud').innerHTML = '<div class="tuner">No settings can be tuned live here.</div>'; return; }
  let ctl;
  if (f.control === 'slider') {
    const r = f.range;
    ctl = `<input type="range" data-live="${f.path}" min="${r.min}" max="${r.max}" step="${r.step ?? 'any'}" value="${f.value}"><output>${esc(fmt(f.path, f.value, { bundle, vm }))}</output>`;
  } else if (f.control === 'toggle') {
    ctl = `<div class="tseg"><button class="${!f.value ? 'on' : ''}" data-lset="${f.path}" data-value="${enc(false)}">Off</button><button class="${f.value ? 'on' : ''}" data-lset="${f.path}" data-value="${enc(true)}">On</button></div>`;
  } else {
    ctl = `<div class="tseg">${(f.options ?? []).filter(o => o.status === 'ok').map(o => `<button class="${o.value === f.value ? 'on' : ''}" data-lset="${f.path}" data-value="${enc(o.value)}">${esc(o.label)}</button>`).join('')}</div>`;
  }
  const changed = new Set(S.pending.map(p => p.path));
  const ro = f.readouts?.[0]?.text ?? '';
  $('hud').innerHTML = `<div class="tuner">
    <div class="tuner-top">
      <button class="nav" data-hud="prev"><span class="ms">chevron_left</span></button>
      <div class="tuner-name" title="${esc(f.label)}"><div class="tuner-label">${esc(f.label)}</div><div class="tuner-idx">${esc(bundle.ui.groups.find(g => g.id === f.group)?.label)} · ${S.hudIndex + 1}/${liveFields.length}</div></div>
      <button class="nav" data-hud="next"><span class="ms">chevron_right</span></button>
      <div class="tuner-dots">${liveFields.map((x, i) => `<i class="${i === S.hudIndex ? 'on' : ''} ${changed.has(x.path) ? 'mod' : ''}"></i>`).join('')}</div>
      <span style="margin-left:auto">${tierBadge(3)}</span>
      <button class="nav" data-hud="close" title="Hide (F2)"><span class="ms">close</span></button>
    </div>
    <div class="tuner-ctl">${ctl}</div>
    <div class="tuner-foot"><span class="ro" title="${esc(ro)}">${esc(ro)}</span><span>hold <kbd>C</kbd> to compare</span>
      <span class="sp">${vm.ledger.changeCount ? `<span style="color:#C4B5FD">${vm.ledger.changeCount} unsaved</span><button class="tbtn" data-hud="revert">Revert</button><button class="tbtn primary" data-hud="keep">Keep</button>` : '<span>changes apply instantly</span>'}</span></div>
  </div>`;
}

// ---------- pause menu (R8: T2/T3 editable, T1 read-only summary) ----------
function renderPause() {
  if (S.mode !== 'paused') { $('pause').innerHTML = ''; return; }
  const ctx = { bundle, vm, focus: null, disclosure: 'advanced' };
  const groups = bundle.ui.groups.filter(g => Object.values(vm.fields).some(f => f.group === g.id && f.visible && !f.disclosureHidden));
  if (!S.tab || !groups.some(g => g.id === S.tab)) S.tab = groups[0]?.id;
  const fs = Object.values(vm.fields).filter(f => f.group === S.tab && f.visible && !f.disclosureHidden);
  const editable = fs.filter(f => f.state !== 'readOnly' || f.reason !== 'Change from the main menu');
  const locked = fs.filter(f => f.state === 'readOnly' && f.reason === 'Change from the main menu');
  const tier = vm.ledger.applyTier;
  $('pause').innerHTML = `<div class="pause"><div class="pmenu">
    <div class="ptabs"><h2>Video</h2>${groups.map(g => `<button class="ptab ${g.id === S.tab ? 'on' : ''}" data-tab="${g.id}"><span class="ms">${g.icon}</span>${esc(g.label)}</button>`).join('')}
      <button class="btn resume" data-resume>Resume <kbd style="color:var(--muted);border-color:var(--border-2)">Esc</kbd></button></div>
    <div class="pbody"><h3>${esc(groups.find(g => g.id === S.tab)?.label)}</h3>
      <div class="pctx">In session: settings that need a rebuild are locked here. Quick-reload changes apply with a brief hitch.${S.online ? ' Online: some settings are set by the server.' : ''}</div>
      <div class="cards">${editable.map(f => renderCard(f, ctx)).join('') || '<div class="note">Nothing in this group can change during a session.</div>'}</div>
      ${locked.length ? `<details class="locked"><summary><span class="ms">lock</span> Locked during session (${locked.length}) · change from the main menu</summary>${locked.map(f => `<div class="row"><span>${esc(f.label)}</span><span>${esc(fmt(f.path, f.value, ctx))}</span></div>`).join('')}</details>` : ''}
    </div>
    <div class="pside"><div class="h">Changes</div><div class="b">${renderLedger(vm, ctx)}</div>
      <div class="f"><div class="note">${vm.ledger.changeCount ? `${tierBadge(tier)} ${tier === 2 ? 'Applies with a brief hitch (no rebuild)' : 'Already live'}` : 'No pending changes'}</div>
      <div style="display:flex;gap:8px"><button class="btn" data-prevert ${vm.ledger.changeCount ? '' : 'disabled'}>Revert</button><button class="btn btn-primary" style="flex:1" data-papply ${vm.ledger.changeCount ? '' : 'disabled'}>Apply</button></div></div></div>
  </div></div>`;
}

function renderDev() {
  $('rig').innerHTML = rigIds.map(id => `<option value="${id}" ${id === S.rigId ? 'selected' : ''}>${esc(rigs[id].label)}</option>`).join('');
  $('mode').innerHTML = [['live', 'Driving'], ['paused', 'Paused']].map(([v, l]) => `<button class="${S.mode === v ? 'on' : ''}" data-mode="${v}">${l}</button>`).join('');
  $('online').innerHTML = [[false, 'Off'], [true, 'On']].map(([v, l]) => `<button class="${S.online === v ? 'on' : ''}" data-online="${v}">${l}</button>`).join('');
  $('toMenu').href = `main-menu.html?rig=${S.rigId}`;
}

function render() { compute(); computeLiveFields(); renderDev(); renderScene(); renderPerf(); renderHud(); renderPause(); }

function toast(html, ms = 1200) { const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = html; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }
function keep() { base = { ...vm.cfg }; S.pending = []; render(); toast('<span class="ms">check_circle</span>Kept'); }
function revert() { S.pending = []; render(); toast('<span class="ms">undo</span>Reverted'); }
function move(d) { if (!liveFields.length) return; S.hudIndex = (S.hudIndex + d + liveFields.length) % liveFields.length; renderHud(); }
function adjust(d) {
  const f = liveFields[S.hudIndex]; if (!f) return;
  if (f.control === 'slider') {
    const r = f.range, step = r.step ?? (r.max - r.min) / 100;
    const v = Math.min(r.max, Math.max(r.min, Math.round(((f.value ?? r.min) + d * step) / step) * step));
    setValue(f.path, Number(v.toFixed(4)));
  } else if (f.control === 'toggle') setValue(f.path, !f.value);
  else {
    const opts = (f.options ?? []).filter(o => o.status === 'ok'); const i = opts.findIndex(o => o.value === f.value);
    setValue(f.path, opts[Math.min(opts.length - 1, Math.max(0, i + d))].value);
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-hud],[data-lset],[data-mode],[data-online],[data-tab],[data-resume],[data-set],[data-revert],[data-papply],[data-prevert],[data-goto]');
  if (!t) return;
  const h = t.dataset.hud;
  if (h === 'open') { S.hudOpen = true; return renderHud(); }
  if (h === 'close') { S.hudOpen = false; return renderHud(); }
  if (h === 'prev') return move(-1);
  if (h === 'next') return move(1);
  if (h === 'keep') return keep();
  if (h === 'revert') return revert();
  if (t.dataset.lset) return setValue(t.dataset.lset, dec(t.dataset.value));
  if (t.dataset.mode) { S.mode = t.dataset.mode; return render(); }
  if (t.dataset.online) { S.online = t.dataset.online === 'true'; return render(); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; return renderPause(); }
  if ('resume' in t.dataset) { S.mode = 'live'; return render(); }
  if (t.dataset.set) return setValue(t.dataset.set, dec(t.dataset.value));
  if (t.dataset.revert) { S.pending = S.pending.filter(p => p.path !== t.dataset.revert); return render(); }
  if ('prevert' in t.dataset) return revert();
  if ('papply' in t.dataset) {
    const t2 = vm.ledger.applyTier === 2;
    if (t2) toast('<span class="spinner"></span>Reconfiguring… (feature reload, no rebuild)', 1000);
    setTimeout(() => { base = { ...vm.cfg }; S.pending = []; render(); toast('<span class="ms">check_circle</span>Applied'); }, t2 ? 900 : 0);
  }
});
document.addEventListener('input', e => {
  const p = e.target.dataset.live ?? e.target.dataset.slider;
  if (!p) return;
  const v = Number(e.target.value);
  e.target.nextElementSibling.textContent = fmt(p, v, { bundle, vm });
  setValue(p, v, false); // live preview without rebuilding the HUD (keeps the drag)
});
document.addEventListener('change', e => {
  if (e.target.dataset.live || e.target.dataset.slider) render();
  if (e.target.dataset.select) setValue(e.target.dataset.select, dec(e.target.value));
  if (e.target.id === 'rig') { loadRig(e.target.value); render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'F2') { e.preventDefault(); S.hudOpen = !S.hudOpen; return renderHud(); }
  if (e.key === 'Escape') { S.mode = S.mode === 'live' ? 'paused' : 'live'; return render(); }
  if (S.mode !== 'live' || !S.hudOpen) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); adjust(1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); adjust(-1); }
  if ((e.key === 'c' || e.key === 'C') && !S.compare) { S.compare = true; renderScene(); }
});
document.addEventListener('keyup', e => { if ((e.key === 'c' || e.key === 'C') && S.compare) { S.compare = false; renderScene(); } });
window.addEventListener('resize', () => renderScene());
setInterval(() => vm && renderPerf(), 600);

loadRig(S.rigId);
render();
window.__mock = { get vm() { return vm; }, get live() { return liveFields.map(f => f.path); }, S, setValue };
</script>
</body>
</html>
