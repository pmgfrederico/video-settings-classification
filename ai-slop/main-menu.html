<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Settings — Motorsport</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="motorsport.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
  /* Engine-bay photo under a matte overlay. The gradient underneath keeps the look if the image is unavailable. */
  .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 30% 20%, #1E2638 0%, #0B0F17 60%, #020617 100%); }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05); }
  .backdrop::after { content: ''; position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(1.5px); }
  .devbar, header, .strip, main, footer { position: relative; z-index: 1; }

  /* Mockup controls, outside the game UI. */
  .devbar { background: #000; color: var(--muted); font-family: var(--mono); font-size: 11px; display: flex; align-items: center; gap: 14px; padding: 6px 32px; flex-shrink: 0; white-space: nowrap; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .devbar b { color: #fff; letter-spacing: .08em; }
  .devbar select { font: inherit; background: var(--well); color: #fff; border: 1px solid var(--line-3); border-radius: 4px; padding: 3px 6px; }
  .devbar .seg { padding: 2px; flex-wrap: nowrap; flex-shrink: 0; }
  .devbar .seg button { padding: 2px 8px; font-size: 11px; }
  .devbar .rigdesc { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .devbar .links { display: flex; gap: 14px; flex-shrink: 0; }

  header { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 32px; border-bottom: 1px solid var(--line-2); background: var(--chrome); backdrop-filter: blur(12px); }
  .logo { font-family: var(--racing); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .logo span { color: var(--red); letter-spacing: .12em; margin-left: 4px; }
  .crumb { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .crumb::before { content: '/'; color: rgba(255,255,255,.2); font-weight: 300; margin-right: 12px; }
  .hright { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .search { position: relative; width: 224px; }
  .search input { width: 100%; padding: 6px 12px 6px 28px; background: rgba(0,0,0,.4); border: 1px solid var(--line-2); border-radius: 4px; font-family: var(--mono); font-size: 12px; color: var(--text); transition: border-color .15s; }
  .search input::placeholder { color: var(--dim); }
  .search input:focus { outline: none; border-color: var(--red); }
  .search::before { content: '/'; position: absolute; left: 11px; top: 6px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .health { padding: 5px 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line-2); border-radius: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .health.ok .ms { color: var(--green); } .health.warn .ms { color: var(--amber); } .health.critical .ms { color: var(--rose); }

  /* Telemetry strip: the rig summary as three readout blocks. */
  .strip { flex-shrink: 0; padding: 12px 32px; border-bottom: 1px solid var(--line-2); background: var(--strip); backdrop-filter: blur(4px); }
  #rigstrip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1024px; margin: 0 auto; }
  .pill { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: rgba(0,0,0,.3); border: 1px solid var(--line-2); border-radius: 4px; font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .ms { color: var(--red); font-size: 18px; }

  main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  nav.rail { width: 256px; flex-shrink: 0; border-right: 1px solid var(--line-2); background: var(--rail); backdrop-filter: blur(12px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; counter-reset: grp; }
  .nav-h { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; margin: 24px 0 10px; }
  .nav-i { flex-shrink: 0; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 14px; margin-bottom: 6px; border-radius: 4px; font-size: 12px; font-weight: 500; color: var(--muted); transition: color .15s, background .15s; }
  .nav-i:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .nav-i.on { background: var(--red); color: #fff; font-weight: 600; }
  /* Numbered groups, as the prototype's "01 / 02 / 03" rail. */
  .nav-i[data-group]:not([data-group="system"])::before { counter-increment: grp; content: counter(grp, decimal-leading-zero); font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .nav-i.on::before { color: rgba(255,255,255,.7) !important; }
  .nav-i .ms { font-size: 16px; }
  .nav-i .cnt { margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--red); color: #fff; }
  .nav-i.on .cnt { background: rgba(0,0,0,.3); }
  .nav-i .sev { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; }
  /* Legend: the prototype's status card at the foot of the rail. */
  .disc { margin-top: auto; padding: 14px; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 4px; }
  .disc .nav-h { margin: 0 0 10px; }
  .disc > div { flex-direction: row !important; flex-wrap: wrap; gap: 6px !important; }

  .center { flex: 1; min-width: 0; overflow-y: auto; padding: 32px 48px 40px; }
  .center > * { max-width: 1100px; }
  .group-h h1 { font-family: var(--racing); font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
  .ctxnote { font-size: 12px; color: var(--dim); margin-bottom: 28px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sec { margin-bottom: 36px; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line-2); }
  .sec-h h2 { margin: 0; font-family: var(--racing); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
  .sec-h h2::before { content: ''; width: 6px; height: 14px; background: var(--red); border-radius: 1px; }
  .sec-h .why { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 4px 10px; background: rgba(255,255,255,.05); border: 1px solid var(--line-2); border-radius: 4px; }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .more { font-size: 12px; color: var(--dim); padding: 6px 2px; }

  aside.right { width: 320px; flex-shrink: 0; border-left: 1px solid var(--line-2); background: var(--rail); backdrop-filter: blur(12px); display: flex; flex-direction: column; min-height: 0; }
  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); background: rgba(0,0,0,.3); font-family: var(--mono); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .panel-h > span { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .panel-b { padding: 16px; overflow-y: auto; }
  .ledger { flex: 1 1 55%; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--line-2); }
  .inspector { flex: 1 1 45%; display: flex; flex-direction: column; min-height: 0; background: rgba(0,0,0,.4); }
  .inspector .panel-h { background: transparent; color: var(--dim); font-size: 11px; }
  #inspTag { font-size: 10px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--text); background: rgba(255,255,255,.1); padding: 2px 8px; border-radius: 3px; max-width: 150px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #inspTag:empty { display: none; }

  footer { height: 64px; flex-shrink: 0; border-top: 1px solid var(--line-2); background: var(--bar); backdrop-filter: blur(12px); display: flex; align-items: center; padding: 0 32px; gap: 24px; }
  .textbtn { border: 0; background: none; padding: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .textbtn:hover { color: var(--text); }
  .vsep { width: 1px; height: 16px; background: var(--line-2); }
  .fstat { font-family: var(--mono); font-size: 12px; color: var(--dim); display: flex; gap: 14px; white-space: nowrap; overflow: hidden; }
  .apply { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .apply-sum { font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; line-height: 1.5; }
  .apply-sum b { color: var(--text); }
  #applyBtn { padding: 9px 20px; letter-spacing: .1em; }

  /* System & health page */
  .sys-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 36px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
  .box h3 { margin: 0 0 10px; font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .rig-name { font-weight: 700; font-size: 15px; }
  .rig-sub { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 4px; line-height: 1.6; }
  .check, .ins { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-2); align-items: start; }
  .check:first-of-type, .ins:first-of-type { border-top: 0; padding-top: 0; }
  .check .ms, .ins > .ms { font-size: 18px; }
  .ok-c { color: var(--green); } .warn-c { color: var(--amber); } .info-c { color: var(--blue); } .crit-c { color: var(--rose); } .dim-c { color: var(--dim); }
  .check .t, .ins .t { font-weight: 600; font-size: 13px; } .check .d, .ins .d { color: var(--dim); font-size: 12px; margin-top: 2px; line-height: 1.45; }
  .check .v { font-family: var(--mono); font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .tech { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tech th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 0 8px 10px; border-bottom: 1px solid var(--line-2); }
  .tech td { padding: 10px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  .tech tr:last-child td { border-bottom: 0; }
  .tech td:first-child { font-weight: 600; white-space: nowrap; }
  .tstat { display: inline-flex; flex-direction: column; gap: 2px; margin: 0 8px 8px 0; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line-3); background: rgba(0,0,0,.2); min-width: 130px; }
  .tstat .n { font-weight: 600; font-size: 12px; }
  .tstat .s { font-family: var(--mono); font-size: 10px; }
  .tstat.active { border-color: var(--red); background: var(--red-soft); }
  .tstat.none { opacity: .5; border-style: dashed; }
  details.unav summary { cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  details.unav li { font-size: 12px; margin: 4px 0; } details.unav li span { color: var(--dim); }

  @media (max-width: 1360px) { aside.right { width: 290px; } nav.rail { width: 220px; } .center { padding: 24px 28px 32px; } header, .strip, footer { padding-left: 20px; padding-right: 20px; } .search { width: 180px; } }
  @media (min-width: 2400px) and (min-height: 1300px) { body { zoom: 1.2; height: calc(100vh / 1.2); } }
  @media (min-width: 3400px) and (min-height: 1900px) { body { zoom: 1.5; height: calc(100vh / 1.5); } }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><img alt="" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBf_fN6qEmYI4GIbTog5_50vBEtnJCEqK3A5pz7V8nfrbdaAyLlpQNo1EuPcF_p4L2yzeMO4Hv-mvlqCcwDSrd3gP0HtqmuKrgoTkmsukjkVUtHy5Nh3kC6qli7i4l1CgTXJusKAyiKykhMx8XWKp_vXMk-cmGlqNv_mJb1AmgOqGRhmpsf44sUqqH6oBVWW_VEIh1xvDc5K8ITyghCTGwnbabXGDBN5evhZa_Iv0FRauuCPTnNypHTdw" onerror="this.remove()"></div>
<div class="devbar">
  <b>MOCKUP</b>
  <label>Rig <select id="rig"></select></label>
  <span class="rigdesc" id="rigdesc"></span>
  <span>Detail</span><div class="seg" id="disc"></div>
  <span class="links"><a href="../mockups/main-menu.html" id="toWinui">Current main menu</a><a href="../mockups/explorer.html" id="toExplorer">Facet explorer →</a><a href="../mockups/in-game.html" id="toGame">In-game →</a></span>
</div>
<header>
  <div class="logo">Assetto Corsa<span>EVO</span></div>
  <div class="crumb">Video Settings</div>
  <div class="hright">
    <div class="search"><input id="search" placeholder="Filter settings..." autocomplete="off"></div>
    <div class="health" id="health"></div>
  </div>
</header>
<section class="strip"><div id="rigstrip"></div></section>
<main>
  <nav class="rail" id="nav"></nav>
  <section class="center" id="center"></section>
  <aside class="right">
    <div class="ledger"><div class="panel-h"><span>Session activity <span id="ledCount"></span></span><button class="icon-btn" id="revertAll" title="Revert all"><span class="ms">restart_alt</span></button></div><div class="panel-b" id="ledger"></div></div>
    <div class="inspector"><div class="panel-h"><span>Inspector focus</span><span id="inspTag"></span></div><div class="panel-b" id="inspector"></div></div>
  </aside>
</main>
<footer>
  <button class="textbtn" id="back">Back</button>
  <div class="vsep"></div>
  <div class="fstat" id="fstat"></div>
  <div class="apply"><div class="apply-sum" id="applySum"></div><button class="btn" id="export">Export config</button><button class="btn btn-primary" id="applyBtn">Apply</button></div>
</footer>
<div id="layer"></div>

<script type="module" src="../mockups/main-menu.js"></script>
<script>
  // Archived style (not linked from the site). Keep the main-menu link on the same rig and detail level.
  document.getElementById('toWinui').addEventListener('click', e => { e.currentTarget.href = '../mockups/main-menu.html' + location.search; });
</script>
</body>
</html>
