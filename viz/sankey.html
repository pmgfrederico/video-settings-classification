<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Settings — Sankey Classification</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 14px system-ui, sans-serif; color: #202124; background: #fafafa; }
  header { flex: none; padding: 16px 20px 10px; }
  h1 { margin: 0; font-size: 18px; }
  .sub { margin: 5px 0 12px; color: #5f6368; font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; color: #3c4043; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; }
  #chart-wrapper { flex: 1 1 auto; min-height: 0; overflow: auto; border-top: 1px solid #dadce0; background: #fff; }
  #chart svg { display: block; }
  #chart-wrapper::-webkit-scrollbar { width: 14px; height: 14px; }
  #chart-wrapper::-webkit-scrollbar-track { background: #f1f3f4; }
  #chart-wrapper::-webkit-scrollbar-thumb { background: #bdc1c6; border: 3px solid #f1f3f4; border-radius: 8px; }
  .link { fill: none; stroke-opacity: .34; }
  .link:hover { stroke-opacity: .82; }
  .node rect { stroke: #fff; stroke-width: 1px; }
  .node text { font-size: 11px; fill: #202124; }
  #tooltip { position: fixed; z-index: 2; pointer-events: none; opacity: 0; padding: 7px 10px; background: #fff; border: 1px solid #dadce0; border-radius: 5px; box-shadow: 0 2px 8px #0002; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Video Settings Classification — Reset Tier → Display Scope → Setting Class → Field</h1>
  <p class="sub">In-menu settings. Scroll horizontally and vertically; hover nodes or ribbons for details.</p>
  <div class="legend">
    <span><i style="background:#b3261e"></i>Tier 1 — Full reset (hypothesis)</span>
    <span><i style="background:#a15c00"></i>Tier 2 — Quick reallocation (hypothesis)</span>
    <span><i style="background:#188038"></i>Tier 3 — Runtime/live (hypothesis)</span>
  </div>
</header>
<div id="chart-wrapper"><div id="chart"></div></div>
<div id="tooltip"></div>
<script>
const colors = {
  "Tier 1 - Full Reset": "#b3261e",
  "Tier 2 - Quick Reallocation": "#a15c00",
  "Tier 3 - Free": "#188038"
};
const tierOrder = ["Tier 1 - Full Reset", "Tier 2 - Quick Reallocation", "Tier 3 - Free"];
const scopeOrder = ["General", "Single", "Triple", "Hybrid Cockpit", "HMD"];
const classOrder = ["Window/Monitor", "Mode Switch", "Frame Pacing", "Upscaling/FrameGen", "Anti-Aliasing", "Textures/Materials", "LOD/Draw Distance", "Shadows", "Lighting/GI", "Reflections", "Atmosphere/Clouds", "Vegetation/Particles", "Post-Processing", "Triple Screen Geometry", "Vehicle/Cockpit", "VR Rendering", "VR Comfort"];
const stageOrder = {tier: tierOrder, scope: scopeOrder, class: classOrder, field: []};
const stageLabels = ["Reset tier", "Display scope", "Setting class", "Field"];
const tierColor = d => colors[d.tier] || "#888";

fetch("../data/sankey_rows.json").then(r => {
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}).then(rows => {
  const nodes = [], nodeByKey = new Map(), linksByKey = new Map();
  function addNode(stage, name) {
    const key = `${stage}::${name}`;
    if (!nodeByKey.has(key)) {
      const id = nodes.length;
      nodeByKey.set(key, id);
      nodes.push({id, stage, name});
    }
    return nodeByKey.get(key);
  }
  function addLink(aStage, aName, bStage, bName, tier) {
    const source = addNode(aStage, aName), target = addNode(bStage, bName);
    const key = `${source}->${target}`;
    if (!linksByKey.has(key)) linksByKey.set(key, {source, target, value: 0, tier});
    linksByKey.get(key).value += 1;
  }
  for (const [tier, scope, settingClass, field] of rows) {
    addLink("tier", tier, "scope", scope, tier);
    addLink("scope", scope, "class", settingClass, tier);
    addLink("class", settingClass, "field", field, tier);
  }
  const links = [...linksByKey.values()];
  const width = 2500;
  const height = Math.max(1500, rows.length * 15);
  const margin = {top: 48, right: 520, bottom: 24, left: 20};
  const svg = d3.select("#chart").append("svg")
    .attr("width", width).attr("height", height).attr("viewBox", `0 0 ${width} ${height}`)
    .style("background", "#fff");

  const sankey = d3.sankey()
    .nodeId(d => d.id)
    .nodeWidth(14)
    .nodePadding(5)
    .nodeAlign(d3.sankeyJustify)
    .nodeSort((a, b) => {
      const order = stageOrder[a.stage] || [];
      const ai = order.indexOf(a.name), bi = order.indexOf(b.name);
      if (ai >= 0 && bi >= 0) return ai - bi;
      return d3.ascending(a.name, b.name);
    })
    .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);

  const graph = sankey({nodes: nodes.map(d => ({...d})), links: links.map(d => ({...d}))});
  const tooltip = d3.select("#tooltip");
  function showTip(event, html) {
    tooltip.html(html).style("opacity", 1)
      .style("left", `${event.clientX + 12}px`).style("top", `${event.clientY + 12}px`);
  }
  function hideTip() { tooltip.style("opacity", 0); }

  svg.append("g").selectAll("path").data(graph.links).join("path")
    .attr("class", "link")
    .attr("d", d3.sankeyLinkHorizontal())
    .attr("stroke", tierColor)
    .attr("stroke-width", d => Math.max(1, d.width))
    .on("mousemove", (event, d) => showTip(event, `<strong>${d.source.name}</strong> → <strong>${d.target.name}</strong><br>${d.value} setting(s) · ${d.tier}`))
    .on("mouseleave", hideTip);

  const node = svg.append("g").selectAll("g").data(graph.nodes).join("g").attr("class", "node");
  node.append("rect")
    .attr("x", d => d.x0).attr("y", d => d.y0)
    .attr("width", d => d.x1 - d.x0).attr("height", d => Math.max(1, d.y1 - d.y0))
    .attr("fill", d => d.stage === "tier" ? colors[d.name] : "#b8c0cc")
    .on("mousemove", (event, d) => showTip(event, `<strong>${d.name}</strong><br>${d.stage} · ${d.value} setting(s)`))
    .on("mouseleave", hideTip);

  node.append("text")
    .attr("x", d => d.stage === "field" ? d.x1 + 7 : d.x1 + 7)
    .attr("y", d => (d.y0 + d.y1) / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", "start")
    .style("font-size", d => d.stage === "field" ? "9px" : "11px")
    .style("fill", d => d.stage === "field" ? "#5f6368" : "#202124")
    .text(d => d.name);

  svg.append("g").selectAll("text.stage-label").data(stageLabels).join("text")
    .attr("class", "stage-label")
    .attr("x", (_, i) => margin.left + i * ((width - margin.left - margin.right) / 3))
    .attr("y", 24).attr("font-weight", 600).attr("font-size", 12).attr("fill", "#5f6368")
    .text(d => d);
}).catch(err => {
  document.getElementById("chart").innerHTML = `<p style="padding:20px;color:#b3261e">Could not load dataset: ${err.message}. Serve the repository root over HTTP; see README.</p>`;
  console.error(err);
});
</script>
</body>
</html>
