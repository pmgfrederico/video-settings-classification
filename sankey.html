<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Settings — Reset Tier → Scope → Class → Field</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    margin: 0; background: #fafafa; color: #1a1a1a;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 16px; font-weight: 600; padding: 16px 20px 0; margin: 0; flex: none; color: #111; }
  p.sub { padding: 4px 20px 12px; margin: 0; color: #666; font-size: 12px; flex: none; }
  .legend { padding: 0 20px 16px; font-size: 12px; color: #333; flex: none; }
  .legend span { display: inline-flex; align-items: center; margin-right: 16px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; border: 1px solid rgba(0,0,0,0.15); }

  /* Scrollable viewport for the chart only */
  #chart-wrapper {
    flex: 1 1 auto;
    overflow-x: auto;
    overflow-y: auto;
    border-top: 1px solid #e0e0e0;
    background: #ffffff;
  }
  #chart-wrapper svg { display: block; }

  #chart-wrapper::-webkit-scrollbar { height: 14px; width: 14px; }
  #chart-wrapper::-webkit-scrollbar-track { background: #f0f0f0; }
  #chart-wrapper::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 7px; border: 3px solid #f0f0f0; }
  #chart-wrapper::-webkit-scrollbar-thumb:hover { background: #adadad; }

  .node rect { stroke: #ffffff; stroke-opacity: 0.8; cursor: pointer; }
  .node text { fill: #1a1a1a; font-size: 11px; pointer-events: none; }
  .link { fill: none; stroke-opacity: 0.45; transition: stroke-opacity 0.15s; }
  .link:hover { stroke-opacity: 0.85; }
  #tooltip {
    position: fixed; pointer-events: none; background: #ffffff; border: 1px solid #d5d5d5;
    border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #1a1a1a; opacity: 0; transition: opacity .1s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 10;
  }
</style>
</head>
<body>
<h1>Video Settings Classification — Reset Tier → Display Scope → Setting Class → Field</h1>
<p class="sub">In-menu settings only. Hover a ribbon or node to trace a field's full path. Scroll horizontally/vertically to explore. Data: sankey_rows.json</p>
<div class="legend">
  <span><i style="background:#c0392b"></i>Tier 1 – Full Reset</span>
  <span><i style="background:#c98a1f"></i>Tier 2 – Quick Reallocation</span>
  <span><i style="background:#1f8a4c"></i>Tier 3 – Free / Live</span>
</div>

<div id="chart-wrapper">
  <div id="chart"></div>
</div>
<div id="tooltip"></div>

<script>
const tierColor = {
  "Tier 1 - Full Reset": "#c0392b",
  "Tier 2 - Quick Reallocation": "#c98a1f",
  "Tier 3 - Free": "#1f8a4c"
};

d3.json("sankey_rows.json").then(rows => {

  const nodeIndex = new Map();
  const nodes = [];
  function nodeId(stage, name) {
    const key = stage + "::" + name;
    if (!nodeIndex.has(key)) {
      nodeIndex.set(key, nodes.length);
      nodes.push({ name, stage });
    }
    return nodeIndex.get(key);
  }

  const linkMap = new Map();
  function addLink(sourceStage, sourceName, targetStage, targetName, tier) {
    const s = nodeId(sourceStage, sourceName);
    const t = nodeId(targetStage, targetName);
    const key = s + "->" + t;
    if (!linkMap.has(key)) linkMap.set(key, { source: s, target: t, value: 0, tier });
    linkMap.get(key).value += 1;
  }

  rows.forEach(([tier, scope, cls, field]) => {
    addLink("tier", tier, "scope", scope, tier);
    addLink("scope", scope, "class", cls, tier);
    addLink("class", cls, "field", field, tier);
  });

  const links = Array.from(linkMap.values());

  const STAGE_WIDTH = 480;
  const NUM_STAGES = 4;
  const width = STAGE_WIDTH * NUM_STAGES;
  const fieldCount = rows.length;
  const height = Math.max(1600, fieldCount * 16);

  const svg = d3.select("#chart").append("svg")
      .attr("width", width)
      .attr("height", height)
      .style("background", "#ffffff");

  const sankeyGen = d3.sankey()
      .nodeId(d => d.index)
      .nodeWidth(14)
      .nodePadding(4)
      .nodeAlign(d3.sankeyJustify)
      .extent([[1, 10], [width - 260, height - 10]]);

  const graph = sankeyGen({
    nodes: nodes.map((d, i) => ({ ...d, index: i })),
    links: links.map(d => ({ ...d }))
  });

  const tooltip = d3.select("#tooltip");

  svg.append("g")
    .attr("fill", "none")
    .selectAll("path")
    .data(graph.links)
    .join("path")
      .attr("class", "link")
      .attr("d", d3.sankeyLinkHorizontal())
      .attr("stroke", d => tierColor[d.tier] || "#999")
      .attr("stroke-width", d => Math.max(1, d.width))
      .on("mouseover", (event, d) => {
        tooltip.style("opacity", 1)
          .html(`<b>${d.source.name}</b> → <b>${d.target.name}</b><br>${d.value} field(s) · ${d.tier}`);
      })
      .on("mousemove", event => {
        tooltip.style("left", (event.clientX + 14) + "px").style("top", (event.clientY + 8) + "px");
      })
      .on("mouseout", () => tooltip.style("opacity", 0));

  const node = svg.append("g")
    .selectAll("g")
    .data(graph.nodes)
    .join("g");

  node.append("rect")
      .attr("x", d => d.x0)
      .attr("y", d => d.y0)
      .attr("height", d => Math.max(1, d.y1 - d.y0))
      .attr("width", d => d.x1 - d.x0)
      .attr("fill", d => d.stage === "tier" ? (tierColor[d.name] || "#999") : "#b9bdc6")
      .on("mouseover", (event, d) => {
        tooltip.style("opacity", 1).html(`<b>${d.name}</b><br>${d.stage} · value ${d.value}`);
      })
      .on("mousemove", event => {
        tooltip.style("left", (event.clientX + 14) + "px").style("top", (event.clientY + 8) + "px");
      })
      .on("mouseout", () => tooltip.style("opacity", 0));

  node.append("text")
      .attr("x", d => d.stage === "field" ? d.x1 + 6 : (d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6))
      .attr("y", d => (d.y1 + d.y0) / 2)
      .attr("dy", "0.35em")
      .attr("text-anchor", d => d.stage === "field" ? "start" : (d.x0 < width / 2 ? "start" : "end"))
      .text(d => d.name)
      .style("font-size", d => d.stage === "field" ? "9px" : "11px")
      .style("fill", "#1a1a1a");

}).catch(err => {
  document.getElementById("chart").innerHTML =
    "<p style='color:#c0392b;padding:20px'>Could not load sankey_rows.json — make sure it's in the same folder as this HTML file and you're serving it over http:// (not file://), e.g. run <code>python -m http.server</code> in that folder.</p>";
  console.error(err);
});
</script>
</body>
</html>
